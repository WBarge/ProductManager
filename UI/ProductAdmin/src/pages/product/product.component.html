<p-splitter layout="vertical" class="main-splitter" [panelSizes]="[50,50]" >
  <p-splitter-panel class="vertical-panel">
    <p-splitter layout="horizontal" class="product-splitter" [panelSizes]="[50,50]">
      <p-splitter-panel class="form-panel">
        <p style="justify-content: center;">Product Information</p>
        <span class="fieldOnSide">
          <label for="name">Name</label>
          <input
            id="name"
            type="text"
            pInputText
            placeholder="Name"
            [ngModel]="_productObj?.name"
            (ngModelChange)="_productObj && (_productObj.name = $event)"
          />
        </span>
        <span class="fieldOnSide">
          <label for="sku">SKU</label>
          <input
            id="sku"
            type="text"
            pInputText
            placeholder="SKU"
            [ngModel]="_productObj?.sku"
            (ngModelChange)="_productObj && (_productObj.sku = $event)"
          />
        </span>
        <span class="fieldOnSide">
          <label for="quickDescription">Quick Description</label>
          <input
            id="quickDescription"
            type="text"
            pInputText
            placeholder="Quick Description"
            [ngModel]="_productObj?.shortDescription"
            (ngModelChange)="_productObj && (_productObj.shortDescription = $event)"
          />
        </span>
        <span  class="fieldOnSide">
          <label for="price">Price</label>
          <p-inputnumber class="price-input"
            inputId="price"
            placeholder="Price"
            [ngModel]="_productObj?.price"
            (ngModelChange)="_productObj && (_productObj.price = $event)"
            mode="currency"
            currency="USD"
            locale="en-US"
          />
        </span>
        <span  class="fieldOnSide">
          <label for="cost">Cost</label>
          <p-inputnumber class="price-input"
            inputId="cost"
            placeholder="Cost"
            [ngModel]="_productObj?.cost"
            (ngModelChange)="_productObj && (_productObj.cost = $event)"
            mode="currency"
            currency="USD"
            locale="en-US"
          />
        </span>
        <span  class="fieldOnSide">
          <label for="est">Estimated Retail Price</label>
          <p-inputnumber class="price-input"
            inputId="est"
            placeholder="Estimated Price"
            [ngModel]="_productObj?.estimated"
            (ngModelChange)="_productObj && (_productObj.estimated = $event)"
            mode="currency"
            currency="USD"
            locale="en-US"
          />
        </span>
        <span class="field">
          <label for="description">Description</label>
          <textarea rows="5" cols="30" pTextarea
            id="description"
            placeholder="Full Description"
            [ngModel]="_productObj?.description"
            (ngModelChange)="_productObj && (_productObj.description = $event)"></textarea>
        </span>
      </p-splitter-panel>
      <p-splitter-panel class="form-panel">
        <p-fieldset legend="Add an Option to the Product">
          <p-toolbar>
            <ng-template #start>
            </ng-template>
            <ng-template #center>
              <div class="quick-create-fields">
                <span class="fieldOnSide">
                  <label for="Name">Name</label>
                  <p-select
                    id="Name"
                    [options]="_optionsList"
                    optionLabel="label"
                    optionValue="idValue"
                    placeholder="Select an Option"
                    autoDisplayFirst="false"
                    [(ngModel)]="newProductOption.optionId"
                  />
                </span>
                <span class="fieldOnSide" >
                  <label for="Price">Override Price ($0.00 for default option price)</label>
                  <p-inputnumber
                    id="Price"
                    placeholder="Price for Option"
                    [(ngModel)]="newProductOption.price"
                    mode="currency"
                    currency="USD"
                    locale="en-US"
                  />
                </span>
              </div>
            </ng-template>
            <ng-template #end>
              <button type="button" pButton (click)="addOptionToProduct(newProductOption)">Add</button>
            </ng-template>
          </p-toolbar>
        </p-fieldset>
        <p-scrollarea>
          <p-scrollarea-viewport>
            <p-scrollarea-content>
              <ul class="option-list" >
                @for (option of this._productObj?.options; track $index) {
                  <li class="option-item" >
                  <p-fieldset class="option-fieldset" legend=" Product Option {{ $index + 1 }}" toggleable="true">
                    <span class="option-name">
                      <label for="Name-{{ $index }}">Name</label>
                      <input readonly="true"
                        class="option-dropDown"
                        id="Name-{{ $index }}"
                        type="text"
                        pInputText
                        [ngModel]="option.name"
                      />
                    </span>
                    <span class="option-price">
                      <label for="Price-{{ $index }}">Price</label>
                      <p-inputnumber
                        readonly="true"
                        id="Price-{{ $index }}"
                        placeholder="Option Price"
                        [ngModel]="option.price"
                        (ngModelChange)="option.price = $event"
                        mode="currency"
                        currency="USD"
                        locale="en-US"
                      />
                    </span>
                    <button class="option-button" type="button" pButton (click)="_productObj?.options?.splice($index, 1)">Delete</button>
                  </p-fieldset>
                  </li>
                }
              </ul>
            </p-scrollarea-content>
          </p-scrollarea-viewport>
          <p-scrollarea-scrollbar orientation="vertical">
            <p-scrollarea-handle/>
          </p-scrollarea-scrollbar>
        </p-scrollarea>
      </p-splitter-panel>
    </p-splitter>
  </p-splitter-panel>
  <p-splitter-panel  class="vertical-panel">
    <p-splitter layout="horizontal" class="product-splitter"  [panelSizes]="[50,50]">
      <p-splitter-panel class="form-panel">
        <!-- thrid panel content -->
        <p-fieldset legend="Add a Characteristic for the Product">
          <p-toolbar>
            <ng-template #start>
            </ng-template>
            <ng-template #center>
              <div class="quick-create-fields">
                <span class="fieldOnSide">
                  <label for="Characteristic">Characteristic</label>
                  <p-select
                    id="Characteristic"
                    [options]="_chararcteristicList"
                    optionLabel="name"
                    optionValue="idValue"
                    placeholder="Select a Characteristic"
                    autoDisplayFirst="false"
                    (onChange)="characteristicNameChange($event)"
                  />
                </span>
                <span class="fieldOnSide" >
                  <label for="CValue">Value</label>
                  <p-select
                    id="CValue"
                    [options]="_characteristicValueList"
                    optionLabel="value"
                    optionValue="value"
                    placeholder="Select a Value"
                    autoDisplayFirst="false"
                    (onChange)="characteristicValueChange($event)"
                  />
                </span>
              </div>
            </ng-template>
            <ng-template #end>
              <button type="button" pButton (click)="addCharacteristicToProduct(newProductCharacteristic)">Add</button>
            </ng-template>
          </p-toolbar>
        </p-fieldset>
        <p-scrollarea>
          <p-scrollarea-viewport>
            <p-scrollarea-content>
              <ul class="characteristic-list" >
                    @for (productCharacteristic of this._productObj?.characteristics; track $index) {
                      <li class="option-item" >
                      <p-fieldset class="option-fieldset" toggleable="true">
                        <span class="characteristic-name">
                          <label for="Name-{{ $index }}">Name:</label>
                          <span>{{productCharacteristic.name}}</span>
                        </span>
                        <span class="characteristic-price">
                          <label for="Price-{{ $index }}">Value:</label>
                          <span>{{productCharacteristic.characteristicValue}}</span>
                        </span>
                        <button type="button" pButton (click)="this._productObj?.characteristics?.splice($index, 1)">Delete</button>
                      </p-fieldset>
                      </li>
                    }
              </ul>
            </p-scrollarea-content>
          </p-scrollarea-viewport>
          <p-scrollarea-scrollbar orientation="vertical">
            <p-scrollarea-handle/>
          </p-scrollarea-scrollbar>
        </p-scrollarea>
      </p-splitter-panel>
      <p-splitter-panel class="form-panel">
        <p-fieldset legend="Schedule A Sale">
          <p-toolbar>
            <ng-template #start>
            </ng-template>
            <ng-template #center>
              <div class="quick-create-fields">
                <span class="fieldOnSide">
                  <label for="Characteristic">Start Date</label>
                  <p-select
                    id="Characteristic"
                    [options]="_chararcteristicList"
                    optionLabel="name"
                    optionValue="idValue"
                    placeholder="Select a Characteristic"
                    autoDisplayFirst="false"
                    (onChange)="characteristicNameChange($event)"
                  />
                </span>
                <span class="fieldOnSide" >
                  <label for="CValue">End Date</label>
                  <p-select
                    id="CValue"
                    [options]="_characteristicValueList"
                    optionLabel="value"
                    optionValue="value"
                    placeholder="Select a Value"
                    autoDisplayFirst="false"
                    (onChange)="characteristicValueChange($event)"
                  />
                </span>
                <span class="fieldOnSide" >
                  <label for="Price">Sale Price</label>
                  <p-inputnumber
                    id="Price"
                    placeholder="Sale Price"
                    [(ngModel)]="newProductOption.price"
                    mode="currency"
                    currency="USD"
                    locale="en-US"
                  />
                </span>
              </div>
            </ng-template>
            <ng-template #end>
              <button type="button" pButton (click)="addCharacteristicToProduct(newProductCharacteristic)">Add</button>
            </ng-template>
          </p-toolbar>
        </p-fieldset>
      </p-splitter-panel>
    </p-splitter>
  </p-splitter-panel>
</p-splitter>

<button type="button" pButton (click)="submit(_productObj!)">Done</button>
